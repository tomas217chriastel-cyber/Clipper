name: Build AutoClipper apps
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClipper-${{ matrix.os }}
          path: dist/AutoClipper-*
